apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-services-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  demo-services.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum by (service) (rate(http_requests_total[5m]))", "legendFormat": "{{service}}"}],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{service}} p95"}],
          "title": "Request latency p95",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [{"expr": "sum by (service, status) (rate(http_requests_total{status=~\"4..|5..\"}[5m]))", "legendFormat": "{{service}} {{status}}"}],
          "title": "HTTP errors",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "title": "Demo Services",
      "uid": "demo-services"
    }
