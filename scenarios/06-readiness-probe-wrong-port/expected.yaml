id: 06-readiness-probe-wrong-port
title: Frontend readiness probe points at unused port
root_cause_category: probe_misconfig
root_cause_summary: frontend readinessProbe checks port 18080 while the server listens on port 8080.
affected_resource: {kind: Deployment, name: frontend, namespace: boutique}
symptom_resource: {kind: Pod, name: frontend-<replicaset-hash>-<pod-suffix>, namespace: boutique}
change_introduced: spec.template.spec.containers[name=server].readinessProbe.httpGet.port changed to 18080
must_cite_evidence:
  - source: kubernetes.pod_status
    signal: frontend pod Ready=False
  - source: kubernetes.events
    signal: readiness probe connection refused or failed
  - source: kubernetes.rollout_history
    signal: readiness probe port is 18080 while containerPort is 8080
acceptable_hypothesis_keywords: [readiness probe, wrong port, frontend not ready, connection refused]
red_herrings: [frontend Service port 80, healthy HTTP process on port 8080]
revert: scenarios/06-readiness-probe-wrong-port/revert.sh