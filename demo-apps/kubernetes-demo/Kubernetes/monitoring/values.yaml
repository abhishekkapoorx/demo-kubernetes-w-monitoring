grafana:
  adminPassword: "adminPass124"   # for learning only; use a Secret in real setups
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
    - name: Prometheus
      type: prometheus
      uid: prometheus
      access: proxy
      url: http://monitoring-kube-prometheus-prometheus.monitoring:9090
      isDefault: true

prometheus:
  prometheusSpec:
    retention: 7d
    externalUrl: http://localhost:8080/prometheus
    routePrefix: /prometheus
    # Lets Prometheus pick up ServiceMonitors from any Helm release, not just this one
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    externalUrl: http://localhost:8080/alertmanager
    routePrefix: /alertmanager